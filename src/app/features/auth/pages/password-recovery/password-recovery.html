<section class="auth-card">
  <h1>{{ 'auth.passwordRecovery.title' | translate }}</h1>

  @if (sent()) {
    <div class="alert alert--success" role="status">
      {{ 'auth.passwordRecovery.success' | translate }}
    </div>
  } @else {
    <p>{{ 'auth.passwordRecovery.intro' | translate }}</p>

    <app-form-error-summary [form]="form" [fields]="fields" [submitAttempt]="submitAttempt()" />

    <form class="form" novalidate [formGroup]="form" (ngSubmit)="submit()">
      <app-email-field
        inputId="recovery-email"
        label="auth.passwordRecovery.email"
        [control]="form.controls.email"
      />

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="submitting()"
          [attr.aria-busy]="submitting()"
        >
          {{
            (submitting() ? 'auth.passwordRecovery.submitting' : 'auth.passwordRecovery.submit')
              | translate
          }}
        </button>
      </div>
    </form>
  }

  <p>
    <a routerLink="/auth/entrar">{{ 'auth.passwordRecovery.backToSignIn' | translate }}</a>
  </p>
</section>
